<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Philippine Peso Sign (₱) - Main element -->
  <g filter="url(#glow)">
    <!-- Peso symbol with gradient -->
    <text x="100" y="115" font-size="90" font-weight="bold" text-anchor="middle" fill="url(#goldGradient)" font-family="Arial, sans-serif">₱</text>
  </g>

  <!-- Swipe lines (representing card swipe) -->
  <g stroke="url(#cyanGradient)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="70" x2="80" y2="85" />
    <line x1="55" y1="60" x2="85" y2="75" />
    <line x1="60" y1="50" x2="90" y2="65" />
  </g>

  <!-- Swipe lines (right side) -->
  <g stroke="url(#cyanGradient)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="150" y1="70" x2="120" y2="85" />
    <line x1="145" y1="60" x2="115" y2="75" />
    <line x1="140" y1="50" x2="110" y2="65" />
  </g>

  <!-- Decorative dots (credit card style) -->
  <circle cx="70" cy="140" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="85" cy="145" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="100" cy="148" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="115" cy="145" r="3" fill="#06B6D4" opacity="0.6"/>
  <circle cx="130" cy="140" r="3" fill="#06B6D4" opacity="0.6"/>

  <!-- Text: KASKAS -->
  <text x="100" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#06B6D4" font-family="Arial, sans-serif" letter-spacing="2">KASKAS</text>

  <!-- Accent line -->
  <line x1="60" y1="175" x2="140" y2="175" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
</svg>
